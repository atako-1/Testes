<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>primeiro formulário</title>
  <style>
    *{
      margin: 0px;
      padding: 0px;
    
    }
    input{
      background-color: #C0C0C0;
    }
    main >p{
      padding: 5px;
      background-color: #8F8F8F;
    }
    
    .botao  p{
      background-color: blue;
      color: white;
      text-align: center;
      border-radius: 20px;
      font-weight: bolder;
      padding: 10px;
    }
    div.botao{
      border-radius: 20px;
      margin: 10px 10px;
      padding: 2px;
      
      
    }
    div.botao:hover{
      box-sizing: border-box;
      padding: 2px;
      border: 3px solid blue;
      transition: border .3s;
      
      
      
      
    }

  </style>
</head>

<body>
  <main>
  <form>
    <p>Nome<input type="text"></p>
    <p>Sobrenome<input type="text"></p>
    <p>Email<input type="text"></p>
    <p><input type="submit" id="botão"></p>
      
  </form>
  </main>
  <div class="botao">
    

      <p>BOTÃO</p>
    </div>
</body>

</html>
