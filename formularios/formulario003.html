<!DOCTYPE html>
<html lang="pt-bt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    
  </style>
</head>

<body>
  <form autocomplete="on">
    
    <p>
      <label
      for="inome">nome:
      </label>
      
      <input
      type="text"
      name="nome"
      id="inome"
      maxlength="30"
      size="30"
      placeholder="nome completo"
    </p>
    

    <p>
      <label 
      for="isenha">Senha
      </label>
      
      <input
      type="password"
      name="senha"
      id="isenha"
      min="8"
      placeholder="minimo 8 caracteres"
      required
    >
    </p>
    <p>
      <label 
      for="itelefone">telefone
      </label>
      
      <input 
      type="number"
      name="telefone"
      id="itelefone"
      placeholder="número de telefone"
      required
      >
      
    </p>
    <p>
      <input 
      type="reset"
      valur="reset"
      >
      <input 
      type="submit"
      value="enviar"
      >
    </p>
    
    
  </form>
</body>

</html>
