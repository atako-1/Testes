<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>testes de transição</title>
  <style>
  *{
    margin: 0px;
    padding: 0px;
  }
  body{
    height: 100vh;
  }
  div.box{
    padding: 2px;
    box-sizing: border-box;
    border-radius: 15px;
    transition: 0.5s;
    margin: 50px;
    height: auto;
    
    
    
    
  }
  
  
  div.box p{
    transition: 0.1s;
    text-align: center;
    padding: 2px;
    background-color: blue;
    color: white;
    border-radius: 15px;
  }
  
  
  div.box1:hover div.box{
    border: 2px solid blue;
  }
  
  
  div.box:hover p{
    font-size: 0.8em;
    
  }
  
  
  </style>
</head>
  
<body>
  <div class="box1">
    <div class="box">
      <p>Botão</p>
    </div>
  </div>


  
  
</body>

</html>
